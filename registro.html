  <!-- Script de validación simple y Dark Mode -->
  <script>
    // Modo Oscuro (Mismo script de index.html)
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeToggleIcon = document.getElementById('themeToggleIcon');
    function aplicarTema(tema) {
      document.documentElement.setAttribute('data-bs-theme', tema);
      localStorage.setItem('study-match-theme', tema);
      if (tema === 'dark') {
        themeToggleIcon.className = 'bi bi-sun-fill';
      } else {
        themeToggleIcon.className = 'bi bi-moon-stars-fill';
      }
    }
    const temaGuardado = localStorage.getItem('study-match-theme');
    const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    aplicarTema(temaGuardado ? temaGuardado : (prefiereOscuro ? 'dark' : 'light'));
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const temaActual = document.documentElement.getAttribute('data-bs-theme');
        aplicarTema(temaActual === 'dark' ? 'light' : 'dark');
      });
    }

    // Validación básica de contraseñas iguales
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
      const pass1 = document.getElementById('password_usuario').value;
      const pass2 = document.getElementById('confirm_password').value;
      if (pass1 !== pass2) {
        e.preventDefault();
        alert('Las contraseñas no coinciden. Por favor, verifica.');
      }
    });
  </script>
